name: Build APK Free
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip app
        run: |
          unzip -o my-app.zip -d .
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Install deps
        run: npm install
      - name: Install EAS
        run: npm install -g eas-cli
      - name: Build APK
        run: eas build --platform android --profile preview --local --non-interactive --output app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIFAT-AI-APK
          path: app.apk
